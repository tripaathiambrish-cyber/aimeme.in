<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AiMeme.in - Golden Edition</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Space Grotesk',sans-serif;background:#000;color:#fff}
.glass{background:#101010;border:1px solid rgba(255,255,255,0.1)}
</style>
</head>
<body class="min-h-screen">

<!-- HEADER -->
<div class="flex justify-between items-center p-5">
  <h1 class="text-[24px] font-black">AiMeme<span class="text-[#FFD60A]">.in</span></h1>
  <button id="addBtn" onclick="checkAdmin()" class="bg-[#FFD60A] text-black px-5 py-2 rounded-full font-black text-[12px]">+ DROP</button>
</div>

<!-- GALLERY -->
<div id="gallery" class="grid grid-cols-2 gap-3 p-3">
  <!-- Memes yahan load honge -->
</div>

<!-- NEW DROP MODAL - EXACT AS SCREENSHOT -->
<div id="addModal" class="fixed inset-0 bg-black/95 backdrop-blur-xl hidden items-center justify-center z-50 p-4">
  <div class="w-full max-w-[360px] bg-[#0E0E0E] border border-white/10 rounded-[28px] p-6 shadow-2xl">
    <h2 class="text-[24px] font-black">New Drop</h2>
    <p class="text-[10px] tracking-[0.25em] opacity-40 mt-1 font-bold">AIMEME CULTURE • GOLDEN EDITION</p>

    <input id="memeUrl" type="text" placeholder="Image Link (https://...)"
      class="w-full mt-6 p-4 bg-[#1A1A1A] rounded-[16px] text-[14px] border border-[#FFD60A]/60 focus:border-[#FFD60A] outline-none">

    <div class="mt-4 flex items-center gap-3">
      <label class="bg-[#EFEFEF] text-black px-3.5 py-1.5 rounded-[6px] text-[13px] font-bold cursor-pointer">
        Choose file
        <input type="file" id="memeFile" accept="image/*" class="hidden" onchange="handleFile(this)">
      </label>
      <span id="fileName" class="text-[13px] text-white/60 truncate">No file chosen</span>
    </div>

    <textarea id="memeCaption" placeholder="Write caption..."
      class="w-full mt-4 p-4 bg-[#1A1A1A] rounded-[18px] text-[14px] border border-white/10 h-[110px] outline-none resize-none"></textarea>

    <div class="flex gap-3 mt-6">
      <button onclick="closeModal()" class="flex-1 p-4 bg-[#1C1C1C] border border-white/10 rounded-[18px] text-[14px] font-bold">Cancel</button>
      <button onclick="dropMeme()" class="flex-1 p-4 bg-[#FFD60A] bg-gradient-to-br from-[#FFE55A] to-[#FFB800] text-black rounded-[18px] text-[15px] font-black">DROP NOW</button>
    </div>
  </div>
</div>

<!-- ADMIN LOGIN - NO COPY VISIBLE -->
<div id="adminLogin" class="fixed inset-0 bg-black/90 backdrop-blur-xl hidden items-center justify-center z-[80] p-4">
  <div class="w-full max-w-[340px] bg-[#0E0E0E] border border-white/10 rounded-[28px] p-6 text-center">
    <h2 class="font-black text-[16px]">Admin Login</h2>
    <p class="text-[10px] opacity-40 mt-1">Enter your secret password</p>
    <input id="passInput" type="password" placeholder="Password"
      class="w-full mt-6 p-4 bg-[#1A1A1A] rounded-[16px] text-[14px] border border-white/10 text-center outline-none">
    <button onclick="loginAdmin()" class="w-full mt-4 p-4 bg-[#FFD60A] text-black font-black rounded-[16px]">LOGIN</button>
    <button onclick="document.getElementById('adminLogin').classList.add('hidden')" class="mt-3 text-[11px] opacity-50">Cancel</button>
  </div>
</div>

<script>
const ADMIN_PASS = "VidhayakJi@786#AiMeme";
let finalImageData = "";

// File handling
function handleFile(input){
  const file = input.files[0];
  if(!file) return;
  document.getElementById('fileName').innerText = file.name;
  const reader = new FileReader();
  reader.onload = (e) => { finalImageData = e.target.result; };
  reader.readAsDataURL(file);
}

function checkAdmin(){
  if(localStorage.getItem('aimeme_admin') === 'true'){ openModal(); return; }
  document.getElementById('adminLogin').classList.remove('hidden');
  document.getElementById('adminLogin').classList.add('flex');
}

function loginAdmin(){
  const p = document.getElementById('passInput').value.trim();
  if(p === ADMIN_PASS){
    localStorage.setItem('aimeme_admin','true');
    document.getElementById('adminLogin').classList.add('hidden');
    document.getElementById('adminLogin').classList.remove('flex');
    openModal();
  } else {
    alert('Wrong Password');
  }
}

function openModal(){
  document.getElementById('addModal').classList.remove('hidden');
  document.getElementById('addModal').classList.add('flex');
}
function closeModal(){
  document.getElementById('addModal').classList.add('hidden');
  document.getElementById('addModal').classList.remove('flex');
}

function dropMeme(){
  const link = document.getElementById('memeUrl').value.trim();
  const caption = document.getElementById('memeCaption').value.trim();

  // Image Link is OPTIONAL - if file is selected use file, else use link
  let imageToPost = finalImageData;
  if(link) imageToPost = link;

  if(!imageToPost){
    alert('Photo to daal bhai - ya Link ya File');
    return;
  }

  // Save to localStorage (tum Supabase/Firebase use kar rahe ho to yahan API call karna)
  let memes = JSON.parse(localStorage.getItem('aimeme_posts') || '[]');
  memes.unshift({img: imageToPost, caption: caption, time: Date.now()});
  localStorage.setItem('aimeme_posts', JSON.stringify(memes));

  alert('DROP SUCCESSFUL! 🔥');
  closeModal();
  location.reload();
}

// Load gallery
(function loadGallery(){
  const memes = JSON.parse(localStorage.getItem('aimeme_posts') || '[]');
  const g = document.getElementById('gallery');
  if(memes.length === 0){
    g.innerHTML = '<p class="col-span-2 text-center opacity-30 text-sm mt-10">No drops yet. Be the first!</p>';
    return;
  }
  g.innerHTML = memes.map(m => `
    <div class="glass rounded-[20px] overflow-hidden">
      <img src="${m.img}" class="w-full h-48 object-cover">
      ${m.caption? `<p class="p-3 text-[12px]">${m.caption}</p>` : ''}
    </div>
  `).join('');
})();

// Secret admin route
if(window.location.search.includes('admin')){
  checkAdmin();
}
</script>
</body>
</html>
