<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIMEME. — Premium Drop</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Syne:wght@700&display=swap" rel="stylesheet">
<style>
body{font-family:'Space Grotesk',sans-serif;background:#070708}
.gold{background:linear-gradient(90deg,#FFD700,#FFA500,#FFD700);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.glass{background:rgba(20,20,20,0.6);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,0.08)}
.glow:hover{box-shadow:0 0 30px rgba(255,215,0,0.15);border-color:rgba(255,215,0,0.3)}
</style>
</head>
<body class="text-white selection:bg-yellow-400 selection:text-black">
<!-- HEADER GLASS -->
<header class="flex justify-between items-center p-5 sticky top-0 z-30 glass border-b-0 border-b border-white/5">
  <h1 class="text-[22px] tracking-[6px] font-bold" style="font-family:'Syne'">AIMEME<span class="gold">.</span></h1>
  <div class="flex gap-2">
    <div class="hidden md:block text-[10px] tracking-[3px] text-zinc-500 border border-white/10 px-3 py-1.5 rounded-full">EST 2026 • INDIA</div>
    <button id="addBtn" onclick="openModal()" class="hidden bg-white text-black px-5 py-2 rounded-full font-bold text-[11px] tracking-widest">+ DROP</button>
  </div>
</header>

<!-- RUNNING TAG -->
<div class="w-full overflow-hidden border-y border-white/5 bg-yellow-400 text-black text-[10px] tracking-[4px] py-1.5 whitespace-nowrap">
  <marquee>★ NEW DROP LIVE ★ DESI MEMES ONLY ★ NO CRINGE POLICY ★ 100% ORIGINAL CULTURE ★</marquee>
</div>

<div id="grid" class="grid grid-cols-1 md:grid-cols-3 gap-5 p-5 max-w-[1200px] mx-auto mt-6"></div>

<!-- MODAL GLASS -->
<div id="modal" class="fixed inset-0 bg-black/70 backdrop-blur-xl hidden items-center justify-center z-50 p-4">
  <div class="glass w-full max-w-md rounded-[28px] p-7">
    <h2 class="font-bold text-lg mb-1">New Drop</h2><p class="text-[11px] text-zinc-500 tracking-widest mb-5">AIMEME CULTURE • GOLDEN EDITION</p>
    <input id="imgIn" placeholder="Image Link (https://...)" class="w-full p-3.5 glass rounded-2xl mb-3 text-sm outline-none focus:border-yellow-400/50">
    <input type="file" id="fileIn" accept="image/*" class="w-full text-[11px] mb-3 text-zinc-400">
    <textarea id="capIn" placeholder="Write caption..." class="w-full p-3.5 glass rounded-2xl text-sm h-24 outline-none"></textarea>
    <div class="flex gap-3 mt-6">
      <button onclick="closeModal()" class="flex-1 p-3 glass rounded-2xl text-sm">Cancel</button>
      <button onclick="addPost()" class="flex-1 p-3 bg-gradient-to-r from-yellow-300 to-amber-500 text-black font-bold rounded-2xl text-sm">DROP NOW</button>
    </div>
  </div>
</div>

<script>
let posts = JSON.parse(localStorage.getItem('aimeme_posts') || '[]');
if(posts.length==0) posts=[{img:'https://i.imgflip.com/65efzo.jpg',caption:'First Golden Drop - Welcome to AIMEME. Culture 🔥',views:'2.4k'}];

function render(){
  document.getElementById('grid').innerHTML = posts.slice().reverse().map(p=>`
    <div class="glass rounded-[26px] overflow-hidden glow transition-all duration-500 group">
      <div class="relative">
        <img src="${p.img}" class="w-full aspect-[4/5] object-cover group-hover:scale-[1.03] transition duration-700">
        <div class="absolute top-3 left-3 bg-black/70 backdrop-blur px-3 py-1 rounded-full text-[9px] tracking-widest border border-white/10">TRENDING 🔥</div>
        <div class="absolute bottom-3 right-3 bg-yellow-400 text-black text-[8px] font-bold px-2 py-1 rounded-full tracking-widest">AIMEME.</div>
      </div>
      <div class="p-4">
        <p class="text-[13px] leading-[1.4] text-zinc-200">${p.caption}</p>
        <div class="flex justify-between items-center mt-4 text-[10px] tracking-widest text-zinc-500"><span>${p.views||'1.2k'} VIEWS</span><span class="border border-white/10 px-2 py-1 rounded-full">SHARE ↗</span></div>
      </div>
    </div>`).join('');
}
if(window.location.search.includes('admin')) document.getElementById('addBtn').classList.remove('hidden');
function openModal(){document.getElementById('modal').style.display='flex'}
function closeModal(){document.getElementById('modal').style.display='none'}
function addPost(){
  let img=document.getElementById('imgIn').value, cap=document.getElementById('capIn').value||"Golden Drop", file=document.getElementById('fileIn').files[0];
  let push = (im)=>{ posts.push({img:im,caption:cap,views:Math.floor(Math.random()*5+1)+'.'+Math.floor(Math.random()*9)+'k'}); localStorage.setItem('aimeme_posts',JSON.stringify(posts)); closeModal(); render(); };
  if(file){ let r=new FileReader(); r.onload=e=>push(e.target.result); r.readAsDataURL(file);} else { if(!img) return alert('Image daal'); push(img); }
}
render();
</script>
</body>
</html>
