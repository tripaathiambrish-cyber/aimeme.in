<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AiMeme.in - Vidhayak Ji</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
.glass{background:rgba(255,255,255,0.08);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1)}
</style>
</head>
<body class="bg-black text-white min-h-screen p-4">

<!-- Header -->
<div class="flex justify-between items-center mb-6">
  <h1 class="text-2xl font-black">AiMeme<span class="text-[#FFD60A]">.in</span></h1>
  <button id="addBtn" onclick="checkAdmin()" class="hidden bg-[#FFD60A] text-black px-5 py-2 rounded-full font-bold text-sm">+ DROP</button>
</div>

<div id="gallery" class="grid grid-cols-2 gap-4">
  <!-- Tere memes yahan ayenge -->
</div>

<!-- ADD MODAL -->
<div id="addModal" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-50 p-4">
  <div class="glass w-full max-w-sm rounded-[24px] p-6">
    <h2 class="font-bold mb-4">Add New Meme</h2>
    <input id="memeUrl" placeholder="Image URL" class="w-full p-3 glass rounded-2xl text-sm mb-3 bg-black/20">
    <button onclick="addMeme()" class="w-full p-3 bg-[#FFD60A] text-black font-bold rounded-2xl">POST NOW</button>
    <button onclick="closeModal()" class="w-full mt-2 text-xs opacity-60">Close</button>
  </div>
</div>

<!-- ADMIN LOGIN - FINAL SECURE -->
<div id="adminLogin" class="fixed inset-0 bg-black/90 backdrop-blur-xl hidden items-center justify-center z-[80] p-4">
  <div class="glass w-full max-w-sm rounded-[24px] p-6 text-center">
    <h2 class="font-bold text-lg">Vidhayak Admin Login</h2>
    <p class="text-[10px] opacity-60 mt-1">Click to copy password</p>

    <div onclick="copyPass()" class="glass rounded-2xl p-3 flex justify-between items-center my-4 cursor-pointer border border-yellow-500/30">
      <span id="passText" class="text-[12px] font-mono text-yellow-400">VidhayakJi@786#AiMeme</span>
      <span class="bg-[#FFD60A] text-black px-3 py-1 rounded-full text-[10px] font-bold">COPY</span>
    </div>
    <p id="copyMsg" class="text-[10px] text-green-400 hidden mb-2">✓ Copied!</p>

    <input id="passInput" type="text" placeholder="Enter Password" class="w-full p-3 glass rounded-2xl text-sm bg-black/20 text-center">
    <button onclick="loginAdmin()" class="w-full mt-4 p-3 bg-[#FFD60A] text-black font-bold rounded-2xl text-sm">LOGIN NOW</button>
    <button onclick="document.getElementById('adminLogin').classList.add('hidden')" class="w-full mt-3 text-[11px] opacity-50">Cancel</button>
  </div>
</div>

<script>
const ADMIN_PASS = "VidhayakJi@786#AiMeme";

function copyPass(){
  navigator.clipboard.writeText(ADMIN_PASS);
  document.getElementById('copyMsg').classList.remove('hidden');
  setTimeout(()=>document.getElementById('copyMsg').classList.add('hidden'),2000);
}

function checkAdmin(){
  if(localStorage.getItem('aimeme_admin')==='true'){ openModal(); return; }
  document.getElementById('adminLogin').classList.remove('hidden');
  document.getElementById('adminLogin').classList.add('flex');
}

function loginAdmin(){
  let p = document.getElementById('passInput').value.trim();
  if(p === ADMIN_PASS){
    localStorage.setItem('aimeme_admin','true');
    document.getElementById('adminLogin').classList.add('hidden');
    document.getElementById('adminLogin').classList.remove('flex');
    document.getElementById('addBtn').classList.remove('hidden');
    openModal();
  } else {
    alert('Wrong Password! Tune dala: ' + p);
  }
}

function openModal(){
  document.getElementById('addModal').classList.remove('hidden');
  document.getElementById('addModal').classList.add('flex');
}
function closeModal(){
  document.getElementById('addModal').classList.add('hidden');
}
function addMeme(){
  // Tera meme add wala logic yahan
  alert('Meme Posted!');
  closeModal();
}

// Auto check if already logged in
if(localStorage.getItem('aimeme_admin')==='true'){
  document.getElementById('addBtn').classList.remove('hidden');
}

// Secret URL:?admin kholne pe login khulega
if(window.location.search.includes('admin')){
  checkAdmin();
}
</script>
</body>
</html>
