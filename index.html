<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIMEME.IN</title>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:sans-serif}
.glass-header{position:sticky;top:0;z-index:50;background:rgba(0,0,0,0.6);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,215,0,0.3);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;letter-spacing:2px;background: linear-gradient(180deg,#FFD700,#FFA500);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter: drop-shadow(0 0 10px rgba(255,215,0,0.6));font-size:22px;border:1px solid rgba(255,215,0,0.4);padding:6px 14px;border-radius:12px;background-color:rgba(255,215,0,0.08)}
.progress{font-size:12px;color:#FFD700;border:1px solid gold;padding:4px 10px;border-radius:20px}
.meme-card{background:#151515;margin:12px;border-radius:16px;overflow:hidden;border:1px solid #222}
.meme-img{width:100%;max-height:500px;object-fit:cover}
.actions{display:flex;justify-content:space-around;padding:10px;border-top:1px solid #222}
.actions button{background:none;border:none;color:#fff;font-size:14px}
.actions button.active{color:#FFD700}
.announce{background:linear-gradient(90deg,#FFD700,#FF8C00);color:#000;text-align:center;padding:8px;font-weight:bold;font-size:13px}
#scratchBox{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:999;flex-direction:column;justify-content:center;align-items:center;padding:20px}
canvas{border-radius:20px;box-shadow:0 0 30px gold}
</style>
</head>
<body>

<div class="announce">🔥 Follow @aimeme.in on Instagram - Coming Soon! <span id="instaLink"></span></div>

<div class="glass-header">
  <div class="logo" id="logo">AIMEME.IN</div>
  <div class="progress" id="progress">0/5 TO WIN</div>
</div>

<div id="feed"></div>

<div id="scratchBox">
  <h2 style="color:gold">🎁 SLIDE TO OPEN</h2>
  <p>Ungli se ghiso</p>
  <canvas id="scratchCard" width="300" height="180"></canvas>
  <p id="winText" style="display:none;color:#FFD700;font-size:20px;font-weight:bold;margin-top:15px">TIRA 30% OFF - CODE: TIRA30</p>
  <button id="googleBtn" style="display:none;margin-top:15px;padding:12px 20px;background:#fff;color:#000;border:none;border-radius:10px;font-weight:bold;width:280px">Continue with Google to Claim</button>
  <button onclick="document.getElementById('scratchBox').style.display='none'" style="margin-top:10px;background:none;border:none;color:#888">Close</button>
</div>

<script>
// --- MEMES DATA - TU ADMIN SE YAHAN ADD KAREGA ---
const MEMES = [
  {id:1, text:"ME: meme dekhne aaya tha, career dekh liya", img:"https://i.imgflip.com/65efzo.jpg"},
  {id:2, text:"Paisa nahi hai par attitude crore ka", img:"https://i.imgflip.com/65efzo.jpg"},
];

let completed = 0;
let actions = {};

function render(){
  let feed = document.getElementById('feed');
  feed.innerHTML = MEMES.map(m=>`
    <div class="meme-card">
      <div style="padding:10px;font-size:14px">${m.text}</div>
      <img class="meme-img" src="${m.img}">
      <div class="actions">
        <button onclick="doAction(${m.id},'like',this)">❤️ Like</button>
        <button onclick="doAction(${m.id},'comment',this)">💬 Comment</button>
        <button onclick="doAction(${m.id},'share',this)">🔗 Share</button>
      </div>
    </div>
  `).join('');
}
function doAction(id,type,btn){
  if(!actions[id]) actions[id]={};
  actions[id][type]=true;
  btn.classList.add('active');
  if(actions[id].like && actions[id].comment && actions[id].share &&!actions[id].done){
    actions[id].done=true;
    completed++;
    document.getElementById('progress').innerText = completed+'/5 TO WIN';
    if(completed>=5) openScratch();
  }
}
function openScratch(){
  document.getElementById('scratchBox').style.display='flex';
  let c = document.getElementById('scratchCard');
  let ctx = c.getContext('2d');
  ctx.fillStyle="#222"; ctx.fillRect(0,0,300,180);
  ctx.fillStyle="#FFD700"; ctx.font="bold 18px sans-serif";
  ctx.fillText("TIRA BEAUTY 30% OFF",40,80);
  ctx.fillText("CODE: TIRA30",70,110);
  ctx.fillStyle="#C0C0C0"; ctx.fillRect(0,0,300,180);
  let scratching=false;
  c.addEventListener('touchstart',()=>scratching=true);
  c.addEventListener('touchend',()=>{scratching=false; check();});
  c.addEventListener('touchmove',(e)=>{
    let r=c.getBoundingClientRect();
    let x=e.touches[0].clientX-r.left, y=e.touches[0].clientY-r.top;
    ctx.globalCompositeOperation='destination-out';
    ctx.beginPath(); ctx.arc(x,y,18,0,Math.PI*2); ctx.fill();
  });
  function check(){
    document.getElementById('winText').style.display='block';
    document.getElementById('googleBtn').style.display='block';
  }
}
// hidden admin - logo 1 sec press
let t; document.getElementById('logo').addEventListener('touchstart',()=>{t=setTimeout(()=>{let p=prompt('Password Vidhayak Ji?'); if(p==='Ambrish@Vidhayak#2026') alert('Admin Panel ke liye admin.html kholo');},800)});
document.getElementById('logo').addEventListener('touchend',()=>clearTimeout(t));
render();

// Insta link baad me yahan daal dena
// document.getElementById('instaLink').innerHTML = '<a href="https://instagram.com/aimeme.in" style="color:#000"> @aimeme.in </a>';
</script>
</body>
</html>
